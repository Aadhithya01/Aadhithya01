name: Update DSA Stats Card
permissions:
  contents: write
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  update-dsa-stats-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Fetch Stats and Save SVG
        run: |
          curl -o codolio-stats.svg https://dsastats.vercel.app/api/codolio/Aadhi
      
      - name: Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add codolio-stats.svg
          git commit -m "Update Codolio stats" || echo "No changes"
          git push
